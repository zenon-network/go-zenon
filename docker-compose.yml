# The devnet's names, host ports and subnet come from the environment, with the
# values below as defaults, so that a second devnet can run on a host where the
# first one's names, ports or subnet are taken:
#
#   ZNND_DEVNET_NAME         container-name prefix and network name   znnd-devnet
#   ZNND_DEVNET_IMAGE        image built and run                      go-zenon-devnet:latest
#   ZNND_DEVNET_SUBNET       first three octets of the /24            172.30.0
#   ZNND_DEVNET_RPC_HTTP     host port of the RPC node, HTTP          35997
#   ZNND_DEVNET_RPC_WS       host port of the RPC node, WebSocket     35998
#   ZNND_DEVNET_PILLAR_HTTP  host port of pillar 1, HTTP              35991
#
# The node configs under docker/devnet name their seeders by address in
# 172.30.0.0/24; the entrypoint rewrites those when ZNND_DEVNET_SUBNET differs.
services:
  pillar:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ZNND_DEVNET_IMAGE:-go-zenon-devnet:latest}
    container_name: ${ZNND_DEVNET_NAME:-znnd-devnet}-pillar
    restart: unless-stopped
    environment:
      ZNND_ROLE: pillar
      ZNND_DEVNET_SUBNET: ${ZNND_DEVNET_SUBNET:-172.30.0}
    expose:
      - "35995"
    ports:
      - "${ZNND_DEVNET_PILLAR_HTTP:-35991}:35997" # HTTP RPC write endpoint for local integration tests
    volumes:
      - pillar-data:/root/.znn
    networks:
      devnet:
        ipv4_address: ${ZNND_DEVNET_SUBNET:-172.30.0}.10

  pillar2:
    image: ${ZNND_DEVNET_IMAGE:-go-zenon-devnet:latest}
    container_name: ${ZNND_DEVNET_NAME:-znnd-devnet}-pillar2
    restart: unless-stopped
    depends_on:
      - pillar
    environment:
      ZNND_ROLE: pillar2
      ZNND_DEVNET_SUBNET: ${ZNND_DEVNET_SUBNET:-172.30.0}
    expose:
      - "35995"
    volumes:
      - pillar2-data:/root/.znn
    networks:
      devnet:
        ipv4_address: ${ZNND_DEVNET_SUBNET:-172.30.0}.12

  pillar3:
    image: ${ZNND_DEVNET_IMAGE:-go-zenon-devnet:latest}
    container_name: ${ZNND_DEVNET_NAME:-znnd-devnet}-pillar3
    restart: unless-stopped
    depends_on:
      - pillar
    environment:
      ZNND_ROLE: pillar3
      ZNND_DEVNET_SUBNET: ${ZNND_DEVNET_SUBNET:-172.30.0}
    expose:
      - "35995"
    volumes:
      - pillar3-data:/root/.znn
    networks:
      devnet:
        ipv4_address: ${ZNND_DEVNET_SUBNET:-172.30.0}.13

  rpc:
    image: ${ZNND_DEVNET_IMAGE:-go-zenon-devnet:latest}
    container_name: ${ZNND_DEVNET_NAME:-znnd-devnet}-rpc
    restart: unless-stopped
    depends_on:
      - pillar
      - observer
    environment:
      ZNND_ROLE: rpc
      ZNND_DEVNET_SUBNET: ${ZNND_DEVNET_SUBNET:-172.30.0}
    ports:
      - "${ZNND_DEVNET_RPC_HTTP:-35997}:35997" # HTTP RPC
      - "${ZNND_DEVNET_RPC_WS:-35998}:35998" # WS RPC
    volumes:
      - rpc-data:/root/.znn
    networks:
      devnet:
        ipv4_address: ${ZNND_DEVNET_SUBNET:-172.30.0}.11

  observer:
    image: ${ZNND_DEVNET_IMAGE:-go-zenon-devnet:latest}
    container_name: ${ZNND_DEVNET_NAME:-znnd-devnet}-observer
    restart: unless-stopped
    depends_on:
      - pillar
    environment:
      ZNND_ROLE: observer
      ZNND_DEVNET_SUBNET: ${ZNND_DEVNET_SUBNET:-172.30.0}
    expose:
      - "35995"
    volumes:
      - observer-data:/root/.znn
    networks:
      devnet:
        ipv4_address: ${ZNND_DEVNET_SUBNET:-172.30.0}.14

networks:
  devnet:
    name: ${ZNND_DEVNET_NAME:-znnd-devnet}
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${ZNND_DEVNET_SUBNET:-172.30.0}.0/24

volumes:
  pillar-data:
    driver: local
  pillar2-data:
    driver: local
  pillar3-data:
    driver: local
  rpc-data:
    driver: local
  observer-data:
    driver: local
