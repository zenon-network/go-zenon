name: Test

on:
  # "release/**" covers the release candidate branches cut from dev, such as
  # release/0.0.11-rc1, so a fix merged into a frozen branch is tested too.
  pull_request:
    branches:
      - dev
      - testnet
      - master
      - "release/**"
  # A pull request run tests the merge commit GitHub made for that event, with
  # the base branch as it was then. Re-running it does not pick up a newer
  # base. A push run tests the tip of the pushed branch, so the result of a
  # merge is tested even when the base moved after the last pull request run.
  push:
    branches:
      - dev
      - testnet
      - master
      - "release/**"

permissions:
  contents: read

# Pull request runs share a group per pull request, so a new push to the pull
# request cancels the run it replaces. A push run gets a group of its own, so
# it is never cancelled: not by the next merge, and not by the same commit
# arriving on a second branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  harden_security:
    name: Harden Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@2d6823da4039243036c86d76f503c84e2ded2517
  test:
    name: Test
    needs: harden_security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Run tests
        run: |
          go test -failfast -p 1 ./...
  version_script_test:
    name: Verify release version calculation
    needs: harden_security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run version calculation tests
        run: .github/scripts/determine-version.test.sh
